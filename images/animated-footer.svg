<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-label="Building dependable software, one clean layer at a time.">
  <defs>
    <linearGradient id="gold" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9a6700" />
      <stop offset="38%" stop-color="#fab005" />
      <stop offset="50%" stop-color="#fff3bf" />
      <stop offset="62%" stop-color="#fab005" />
      <stop offset="100%" stop-color="#9a6700" />
      <animate attributeName="x1" values="-100%;100%" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3.2s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#8b5cf6;#ff2d95;#fab005;#00e5ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff2d95">
        <animate attributeName="stop-color" values="#ff2d95;#fab005;#00e5ff;#8b5cf6;#ff2d95" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#fab005">
        <animate attributeName="stop-color" values="#fab005;#00e5ff;#8b5cf6;#ff2d95;#fab005" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="goldGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feFlood flood-color="#fab005" flood-opacity="0.38" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <text x="500" y="42" text-anchor="middle" dominant-baseline="middle" fill="url(#gold)" filter="url(#goldGlow)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="700">
    Building dependable software, one clean layer at a time.
  </text>

  <line x1="30" y1="112" x2="970" y2="112" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="180 24" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-204" dur="3s" repeatCount="indefinite" />
  </line>
</svg>
